<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KRISTINUSKON LÄHETYSTYÖ</title>
  <style>
    :root {
      --text: #173b2a;
      --panel: rgba(255,255,255,0.72);
      --panel-border: rgba(255,255,255,0.85);
      --shadow: 0 12px 32px rgba(11, 45, 29, 0.16);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background: #dff3e4;
    }

    body {
      user-select: none;
    }

    /* The horizontal timeline is the only scrolling surface. */
    #viewport {
      width: 100vw;
      height: 100vh;
      overflow-x: auto;
      overflow-y: hidden;
      scroll-behavior: smooth;
      overscroll-behavior: none;
      scrollbar-width: none;
      background:
        linear-gradient(
          90deg,
          #e5f7e9 0%,
          #d5efdc 16%,
          #bfe4c8 32%,
          #98caa7 50%,
          #6ca77d 68%,
          #46785a 83%,
          #294f39 100%
        );
    }

    #viewport::-webkit-scrollbar {
      display: none;
    }

    #track {
      position: relative;
      width: max(100vw, 5200px);
      min-width: 5200px;
      height: 100vh;
      padding: 0 100px;
    }

    .site-name {
      position: fixed;
      z-index: 20;
      top: 22px;
      left: 26px;
      padding: 10px 14px;
      border-radius: 12px;
      background: rgba(255,255,255,0.62);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 5px 18px rgba(10, 50, 27, 0.10);
      font-size: clamp(15px, 1.4vw, 21px);
      font-weight: 800;
      letter-spacing: 0.04em;
    }

    .hint {
      position: fixed;
      z-index: 30;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 17px 24px;
      border-radius: 16px;
      background: rgba(17, 50, 31, 0.78);
      color: white;
      font-size: clamp(15px, 1.7vw, 23px);
      font-weight: 650;
      letter-spacing: 0.01em;
      box-shadow: 0 12px 40px rgba(0,0,0,.18);
      opacity: 1;
      transition: opacity .6s ease, transform .6s ease;
      pointer-events: none;
      white-space: nowrap;
    }

    .hint.hidden {
      opacity: 0;
      transform: translate(-50%, -46%);
    }

    .hint .arrow {
      display: inline-block;
      margin-left: 10px;
      font-size: 1.35em;
      transform: translateY(1px);
      animation: nudge 1.2s ease-in-out infinite;
    }

    @keyframes nudge {
      0%, 100% { transform: translate(0, 1px); }
      50% { transform: translate(7px, 1px); }
    }

    .timeline-header {
      position: absolute;
      top: 135px;
      left: 100px;
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .timeline-header h1 {
      margin: 0;
      font-size: clamp(26px, 3vw, 48px);
      line-height: 1;
      letter-spacing: -0.03em;
    }

    .timeline-header .subtitle {
      margin-top: 5px;
      opacity: .72;
      font-size: 15px;
    }

    .controls {
      position: fixed;
      right: 22px;
      top: 20px;
      z-index: 25;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
      max-width: 330px;
    }

    button {
      border: 0;
      border-radius: 11px;
      padding: 10px 13px;
      background: rgba(255,255,255,0.68);
      color: var(--text);
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 5px 16px rgba(10,50,27,.10);
      backdrop-filter: blur(8px);
    }

    button:hover {
      background: rgba(255,255,255,0.84);
    }

    .timeline {
      position: absolute;
      top: 53%;
      left: 100px;
      right: 100px;
      height: 6px;
      border-radius: 99px;
      background: rgba(255,255,255,.78);
      box-shadow: 0 0 0 1px rgba(27,75,44,.08), 0 4px 14px rgba(14,56,31,.10);
    }

    .timeline::before,
    .timeline::after {
      content: "";
      position: absolute;
      top: 50%;
      width: 23px;
      height: 23px;
      border-radius: 50%;
      background: rgba(255,255,255,.95);
      transform: translateY(-50%);
      box-shadow: 0 3px 12px rgba(12,52,30,.13);
    }

    .timeline::before { left: -6px; }
    .timeline::after { right: -6px; }

    #cards {
      position: absolute;
      top: 53%;
      left: 100px;
      width: 5000px;
      height: 6px;
    }

    .card {
      position: absolute;
      width: 300px;
      min-height: 230px;
      padding: 18px 18px 16px;
      border: 1px solid var(--panel-border);
      border-radius: 18px;
      background: var(--panel);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transform: translateX(-50%);
      cursor: default;
    }

    .card.top {
      bottom: 30px;
    }

    .card.bottom {
      top: 30px;
    }

    .card::after {
      content: "";
      position: absolute;
      left: 50%;
      width: 2px;
      height: 30px;
      background: rgba(255,255,255,.9);
      transform: translateX(-50%);
    }

    .card.top::after {
      bottom: -30px;
    }

    .card.bottom::after {
      top: -30px;
    }

    .dot {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: white;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 0 5px rgba(255,255,255,.18), 0 4px 12px rgba(15,60,32,.14);
      z-index: 3;
    }

    .card-tools {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 8px;
      gap: 5px;
    }

    .mini-btn {
      border: 0;
      background: rgba(255,255,255,.52);
      border-radius: 8px;
      padding: 4px 7px;
      font-size: 12px;
      font-weight: 800;
      color: #355d45;
      cursor: pointer;
      box-shadow: none;
    }

    .date {
      display: block;
      font-size: 13px;
      font-weight: 800;
      opacity: .62;
      margin-bottom: 5px;
    }

    .card h2,
    .card p,
    .date {
      outline: none;
      cursor: text;
      user-select: text;
    }

    .card h2 {
      margin: 0 0 10px;
      font-size: 22px;
      line-height: 1.1;
      color: #173b2a;
    }

    .card p {
      margin: 0;
      font-size: 14px;
      line-height: 1.5;
      color: #31553e;
    }

    .card:focus-within {
      box-shadow: 0 0 0 3px rgba(255,255,255,.55), var(--shadow);
    }

    .footer-tip {
      position: fixed;
      left: 26px;
      bottom: 18px;
      z-index: 20;
      font-size: 12px;
      opacity: .72;
      padding: 7px 10px;
      border-radius: 10px;
      background: rgba(255,255,255,.45);
      backdrop-filter: blur(8px);
    }

    .toast {
      position: fixed;
      z-index: 40;
      left: 50%;
      bottom: 22px;
      transform: translate(-50%, 20px);
      padding: 11px 15px;
      background: rgba(18, 52, 32, .88);
      color: #fff;
      border-radius: 11px;
      font-size: 13px;
      opacity: 0;
      pointer-events: none;
      transition: opacity .25s ease, transform .25s ease;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    @media (max-width: 720px) {
      .site-name {
        left: 12px;
        top: 12px;
        font-size: 12px;
      }

      .controls {
        right: 12px;
        top: 12px;
      }

      .timeline-header {
        left: 50px;
        top: 110px;
      }

      .timeline,
      #cards {
        left: 50px;
      }

      .timeline {
        right: 50px;
      }

      #track {
        padding: 0 50px;
      }
    }
  </style>
</head>
<body>
  <div id="viewport" aria-label="Kristinuskon lähetystyön aikajana">
    <div id="track">
      <div class="timeline-header">
        <div>
          <h1>Kristinuskon lähetystyö</h1>
          <div class="subtitle">Muokkaa aikajanan laatikoiden tekstejä suoraan napsauttamalla.</div>
        </div>
      </div>

      <div class="timeline"></div>
      <div id="cards"></div>
    </div>
  </div>

  <div class="site-name">KRISTINUSKON LÄHETYSTYÖ</div>

  <div class="controls">
    <button id="addBtn">＋ Lisää laatikko</button>
    <button id="saveBtn">Tallenna selaimeen</button>
    <button id="resetBtn">Palauta esimerkkisisältö</button>
  </div>

  <div id="hint" class="hint">
    Scroll for more information <span class="arrow">→</span>
  </div>

  <div class="footer-tip">↑ vieritä oikealle &nbsp; · &nbsp; ↓ vieritä vasemmalle &nbsp; · &nbsp; Tekstit ovat muokattavia</div>
  <div id="toast" class="toast">Tallennettu.</div>

  <script>
    const viewport = document.getElementById('viewport');
    const cards = document.getElementById('cards');
    const addBtn = document.getElementById('addBtn');
    const saveBtn = document.getElementById('saveBtn');
    const resetBtn = document.getElementById('resetBtn');
    const toast = document.getElementById('toast');

    const STORAGE_KEY = 'kristinuskon-lahetystyo-timeline-v1';

    const defaultItems = [
      {
        date: '1. vuosisata',
        title: 'Varhainen kristinusko',
        text: 'Kristinusko alkaa levitä Jerusalemista ja muualle Rooman valtakuntaan apostolien ja ensimmäisten seurakuntien kautta.',
        position: 320,
        side: 'top'
      },
      {
        date: '100–300',
        title: 'Ensimmäiset vuosisadat',
        text: 'Kristilliset yhteisöt kasvavat eri puolilla Välimeren aluetta. Lähetystyö tapahtuu usein matkustavien saarnaajien ja paikallisten yhteisöjen kautta.',
        position: 1050,
        side: 'bottom'
      },
      {
        date: '300–700',
        title: 'Euroopan leviäminen',
        text: 'Kristinusko leviää vähitellen laajemmalle Eurooppaan. Lähetystyöllä ja uusien seurakuntien perustamisella on keskeinen rooli.',
        position: 1800,
        side: 'top'
      },
      {
        date: '700–1100',
        title: 'Pohjois-Eurooppa',
        text: 'Kristinusko saavuttaa uusia alueita Pohjois-Euroopassa. Lähetystyöntekijät, hallitsijat ja paikalliset yhteisöt vaikuttavat kehitykseen.',
        position: 2550,
        side: 'bottom'
      },
      {
        date: '1500–1700',
        title: 'Maailmanlaajuinen lähetystyö',
        text: 'Merenkulun ja uusien reittien myötä eurooppalaiset kristilliset yhteisöt lähettävät lähetystyöntekijöitä myös Euroopan ulkopuolelle.',
        position: 3300,
        side: 'top'
      },
      {
        date: '1800–1900',
        title: 'Lähetystyö järjestäytyy',
        text: 'Lähetysjärjestöt ja seurakunnat kasvattavat järjestelmällistä työtä eri maanosissa. Koulutus, terveydenhuolto ja seurakuntatyö ovat usein mukana.',
        position: 4050,
        side: 'bottom'
      },
      {
        date: '1900–nykyhetki',
        title: 'Nykyaikainen lähetystyö',
        text: 'Lähetystyö toimii monissa muodoissa, kuten seurakuntatyössä, kehitysyhteistyössä, koulutuksessa, mediassa ja paikallisten kirkkojen tukemisessa.',
        position: 4720,
        side: 'top'
      }
    ];

    function escapeHtml(value) {
      return String(value)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function getItems() {
      return [...cards.querySelectorAll('.card')].map(card => ({
        date: card.querySelector('.date').innerText.trim(),
        title: card.querySelector('h2').innerText.trim(),
        text: card.querySelector('p').innerText.trim(),
        position: Number(card.dataset.position),
        side: card.classList.contains('bottom') ? 'bottom' : 'top'
      }));
    }

    function makeCard(item, index) {
      const card = document.createElement('article');
      card.className = 'card ' + (item.side === 'bottom' ? 'bottom' : 'top');
      card.dataset.position = Math.max(160, Math.min(4840, Number(item.position) || (300 + index * 700)));
      card.style.left = `${card.dataset.position}px`;

      card.innerHTML = `
        <div class="card-tools">
          <button class="mini-btn delete-btn" title="Poista laatikko">Poista</button>
          <button class="mini-btn side-btn" title="Vaihda laatikon paikkaa">↕ Vaihda paikka</button>
        </div>
        <span class="date" contenteditable="true" spellcheck="false">${escapeHtml(item.date || 'Uusi ajankohta')}</span>
        <h2 contenteditable="true" spellcheck="true">${escapeHtml(item.title || 'Uusi tapahtuma')}</h2>
        <p contenteditable="true" spellcheck="true">${escapeHtml(item.text || 'Kirjoita tähän tapahtuman kuvaus.')}</p>
        <div class="dot"></div>
      `;

      card.querySelector('.delete-btn').addEventListener('click', () => {
        card.remove();
        showToast('Laatikko poistettu.');
      });

      card.querySelector('.side-btn').addEventListener('click', () => {
        card.classList.toggle('top');
        card.classList.toggle('bottom');
      });

      return card;
    }

    function render(items) {
      cards.innerHTML = '';
      items.forEach((item, index) => cards.appendChild(makeCard(item, index)));
    }

    function save() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(getItems()));
      showToast('Aikajana tallennettu selaimeen.');
    }

    function load() {
      try {
        const stored = JSON.parse(localStorage.getItem(STORAGE_KEY));
        if (Array.isArray(stored) && stored.length) {
          render(stored);
          return;
        }
      } catch (e) {}
      render(defaultItems);
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add('show');
      clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(() => toast.classList.remove('show'), 1800);
    }

    // Map normal vertical mouse-wheel scrolling to horizontal scrolling.
    viewport.addEventListener('wheel', (event) => {
      if (Math.abs(event.deltaY) > Math.abs(event.deltaX)) {
        event.preventDefault();
        viewport.scrollLeft -= event.deltaY;
      }
    }, { passive: false });

    addBtn.addEventListener('click', () => {
      const items = getItems();
      const nextPosition = Math.min(4800, (items.at(-1)?.position || 100) + 650);
      const item = {
        date: 'Uusi ajankohta',
        title: 'Uusi tapahtuma',
        text: 'Kirjoita tähän oma sisältösi.',
        position: nextPosition,
        side: items.length % 2 ? 'bottom' : 'top'
      };
      const card = makeCard(item, items.length);
      cards.appendChild(card);
      card.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
      showToast('Uusi laatikko lisätty.');
    });

    saveBtn.addEventListener('click', save);

    resetBtn.addEventListener('click', () => {
      render(defaultItems);
      localStorage.removeItem(STORAGE_KEY);
      viewport.scrollTo({ left: 0, behavior: 'smooth' });
      showToast('Esimerkkisisältö palautettu.');
    });

    // Allow Ctrl/Cmd + S to save without opening the browser save dialog.
    document.addEventListener('keydown', (event) => {
      if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 's') {
        event.preventDefault();
        save();
      }
    });

    load();

    // Opening hint: visible for 5 seconds.
    setTimeout(() => {
      document.getElementById('hint').classList.add('hidden');
    }, 5000);
  </script>
</body>
</html>
